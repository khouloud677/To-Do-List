<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-List</title>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Homemade+Apple&family=Knewave&family=Reenie+Beanie&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Knewave&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Chewy&family=Knewave&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1><img src="images/cloud.png" alt="cute cloud" class="cloud-image">To-Do-List</h1>
    </header>
    
    <main>
        <div class="container">
             <div class="notebook">
                <div class="spiral"></div>
                    <div class="notebook-cover">
                         <p><img src="images/kitty.png" alt="cute cat" class="cat-image">Your personal notebook</p>
                    </div>
                    <div class="notebook-paper" id="notesContainer">
                        <div class="note">
                            <!-- Les notes seront ajoutées ici dynamiquement -->
                        </div>
                    </div>
                
            </div>
            <div class="stats">
  <span id="totalTasks">Total notes: 0</span> |
  <span id="completedTasks">Complétées: 0</span>
</div>

<div id="notification" class="notification"></div>

        </div>
        <div class="add-note">
            <input type="text" id="newNote" placeholder="Write a new note...">
            <button id="addNoteBtn"><i class="fas fa-plus"></i></button>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
